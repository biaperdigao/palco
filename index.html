       do traço desenhado andou 112px, 18 espessuras. Era isso que a cliente via:
       "o traço não é traçado no lugar onde ele deve ficar pra sempre, e sim fora
       e depois levado pro meio".
       O ajuste novo é TRANSLADADO para que seu começo caia na âncora. Translação
       pura: forma, raio, extensão, sentido e orientação continuam sendo os que o
       ajuste mediu. O que deixa de acontecer é o escorregão. */
    /* ORDEM IMPORTA: a guarda de span monotônico recentra o arco sobre o ponto
       médio, o que desfaz a translação da âncora. Com ela depois, o início
       saltava 41px no quadro em que o arco herdado passa a usar o ajuste
       próprio, e voltava em seis quadros. A guarda vem primeiro; a âncora, por
       último, sempre. */
    if (a.span < vivo.span){
      const angM = a.a0 + a.s*a.span/2;
      a.span = vivo.span;
      a.a0 = angM - a.s*a.span/2;
      a.baseExtent = a.span; a.baseStart = a.a0;
    }
    const ini = pontaInicial(a);
    const dx = vivo.ancora.x - ini.x, dy = vivo.ancora.y - ini.y;
    a.ox += dx; a.oy += dy; a.baseOx += dx; a.baseOy += dy;
    /* E AQUI NÃO SE ARRASTA MAIS NADA. Conter um arco que CRESCE significa puxá-lo
       para o centro a cada quadro, com a âncora junto — medido, a âncora de um
       gesto feito no canto andava 124px e o traço se aproximava 36px do centro
       durante a própria execução. Era o "os traços ainda são feitos fora e vão
       para o centro", e vinha do limite que eu criei para a bola ter órbita.
       O arco é contido UMA VEZ, no nascimento. Se ao crescer ele passar do
       disco, o traço ACABA ali — a corrente fecha este e começa outro, que é o
       mesmo tratamento de quando ele enche de span ou de tempo. Chegar na borda
       do palco é uma forma de estar pronto. */

    adotaGeometria(congela(vivo), a);              // o ALVO muda; a identidade não
  }
}

/* Onde o traço ESTÁ agora, como objeto próprio. Quando a animação assenta, .des
   volta a null e o desenho passa a ser o próprio alvo — se o alvo mudar depois
   disso sem congelar antes, o arco salta para o ajuste novo em vez de persegui-lo.
   Chamar isto antes de qualquer troca de alvo é o que garante a continuidade. */
function congela(a){
  if (!a.des) a.des = { ox:a.ox, oy:a.oy, r:a.r, a0:a.a0, s:a.s, span:a.span };
  return a;
}

/* copia a geometria de um ajuste novo para um arco que já existe, sem tocar em
   .des. É a diferença entre refinar e trocar. */
function adotaGeometria(alvo, novo){
  alvo.ox = novo.ox; alvo.oy = novo.oy; alvo.r = novo.r;
  alvo.a0 = novo.a0; alvo.s = novo.s; alvo.span = novo.span;
  alvo.baseOx = novo.baseOx; alvo.baseOy = novo.baseOy;
  alvo.baseStart = novo.baseStart; alvo.baseExtent = novo.baseExtent;
  alvo.rGesto = novo.rGesto; alvo.devGesto = novo.devGesto; alvo.nPts = novo.nPts;
  alvo.spanBruto = novo.spanBruto; alvo.spanPreso = novo.spanPreso;
  if (novo.trecho) alvo.trecho = novo.trecho;
}

/* O arco para de vez onde está: o alvo passa a ser a geometria DESENHADA, e a
   base junto, para nenhuma passada posterior puxá-lo de volta. Depois disto ele
   é exatamente o traço que a pessoa viu sair da mão. */
function paraOndeEsta(a){
  const g = desenhoDe(a);
  a.ox = g.ox; a.oy = g.oy; a.r = g.r; a.a0 = g.a0; a.s = g.s; a.span = g.span;
  a.baseOx = g.ox; a.baseOy = g.oy; a.baseStart = g.a0; a.baseExtent = g.span;
  a.des = null;
}

function incorpora(e){
  /* CONGELA: "fiz o gesto e ele desenhou e ficou no lugar". O arco que a pessoa
     acompanhou saindo da mão é o arco final — sem reajuste e sem partição.
     Reajustar ao fechar significa que o traço muda de forma no instante em que o
     gesto acaba, e partir em 2 ou 3 significa que ele vira outra coisa. As duas
     são fiéis ao movimento no papel e, na tela, são o desenho se mexendo sozinho
     depois de pronto. ?congela=0 volta ao reajuste com partição, e o número que
     mede o que isso custa é a FUGA na tabela da composição. */
  const arcos = (e && e.aceito && !(vivo && CONGELA)) ? reduzAArcos(e.util || e.pts) : [];
  if (vivo){
    if (CONGELA){
      paraOndeEsta(vivo);
      heranca = (e && e.motivo === "arco cheio")
        ? { ox:vivo.ox, oy:vivo.oy, r:vivo.r, s:vivo.s, a0:vivo.a0 + vivo.s*vivo.span }
        : null;
    } else if (arcos.length){
      /* o arco que a pessoa viu crescer NÃO some, aconteça o que acontecer com o
         episódio: se a redução devolveu trechos, ele vira o primeiro. */
      adotaGeometria(congela(vivo), arcos[0]);
    }
    vivo.vivo = false; vivo.episodio = e;
    for (const a of arcos.slice(1)){
      a.episodio = e; contemNoDesenho(a, DESENHO_RAIO);
      a.des = geometriaDeNascimento(a); composicao.push(a);
    }
    vivo = null;
  } else {
    for (const a of arcos){ a.episodio = e; contemNoDesenho(a, DESENHO_RAIO); composicao.push(a); }
    heranca = null;
  }
  if (e) e.arcos = Math.max(arcos.length, vivo ? 0 : (e.aceito ? 1 : 0));
  if (!composicao.length) return;
  refazPassadas();
  /* e agora tudo o que já fechou está pronto: a passada seguinte não o toca mais */
  for (const a of composicao) if (!a.vivo) a.congelado = true;
  /* o enquadramento NÃO se mexe durante a captura. Reenquadrar a cada gesto
     mudaria a escala do que já está na tela enquanto a pessoa ainda está se
     movendo, e o gesto seguinte não cairia onde ela mira. Fica 1:1 até o fim. */
  semeiaDesenho();
}

function observa(leituras, agora, escalaBruta){
  relogio = agora;
  saude.quadros++;
  saude.t1 = agora;
  if (leituras) saude.comPose++;

  /* a escala do corpo tremula quadro a quadro; o limiar não pode tremular junto.
     Média exponencial lenta: a distância da pessoa à câmera muda em segundos,
     não em quadros. */
  if (escalaBruta != null && isFinite(escalaBruta)){
    const e = Math.min(OMBROS_MAX, Math.max(OMBROS_MIN, escalaBruta));
    ombros = saude.escalaVista ? ombros + (e - ombros)*0.05 : e;
    saude.escalaVista++;
    saude.escalaMin = Math.min(saude.escalaMin ?? e, e);
    saude.escalaMax = Math.max(saude.escalaMax ?? e, e);
  }

  /* o corte de visibilidade, contado ponto a ponto */
  const aceitas = [];
  (leituras || []).forEach(p => {
    const pp = saude.porPonto[p.i]; if (!pp) return;
    const vis = p.vis == null ? 1 : p.vis;
    pp.visMax = Math.max(pp.visMax, vis);
    if (vis < VIS_MIN){ pp.recusadoVis++; return; }
    pp.visto++; aceitas.push(p);
  });
  if (aceitas.length) saude.comLeitura++; else saude.semLeitura++;

  /* buffers. Isto não desenha nada: é o material da arbitragem — sem ele não há
     como saber quem se moveu primeiro. */
  const visto = new Set();
  aceitas.forEach(p => {
    if (!buf[p.i]) buf[p.i] = [];
    const b = buf[p.i], pp = saude.porPonto[p.i];
    const x = (1 - p.x)*W, y = p.y*H;                     // a cena é espelhada
    visto.add(p.i);                                       // visto mesmo se a amostra cair

    if (b.length){
      const u = b[b.length-1], dt = (agora - u.t)/1000;
      const v = dt > 0 ? Math.hypot(x-u.x, y-u.y)/dt : Infinity;
      pp.vBruto = Math.max(pp.vBruto, v);                 // o pico ANTES do corte
      /* a distribuição inteira, não só o pico: é nela que se vê onde o braço
         acaba e o artefato começa. O espécime da Sens foi medido assim —
         medianas e percentis, não valores isolados. */
      if (isFinite(v) && pp.vs.length < 4000) pp.vs.push(v);
      if (CORTA_SALTO && v > V_SALTO){
        pp.salto++;
        if (++pp.saltoSeq < SALTO_SEGUIDOS) return;       // erro do rastreador: descarta
        b.length = 0;                                     // persistiu: realocação, recomeça
      } else pp.saltoSeq = 0;
    }
    b.push({ x, y, t:agora });
  });
  for (let i=0; i<buf.length; i++){
    if (!visto.has(i)){
      if (!perdaDesde[i]){ perdaDesde[i] = agora; const pp = saude.porPonto[i]; if (pp) pp.piscadas++; }
      if (agora - perdaDesde[i] > PERDA_MS){
        buf[i].length = 0;                                // sumiu de verdade: esquece
        if (perdaDesde[i] > 0) saude.porPonto[i] && saude.porPonto[i].perdas++;
        perdaDesde[i] = -1;                               // já contabilizada
      }
    } else perdaDesde[i] = 0;
    while (buf[i].length && agora - buf[i][0].t > MEM_MS) buf[i].shift();
  }
  /* a bola segue o ponto ATIVO; sem nenhum ativo, o último ponto que foi visto.
     Exclusividade vale para ela também: uma mão de cada vez. */
  {
    let fonteBola = ativo ? buf[ativo.ponto] : null;
    if (!fonteBola || !fonteBola.length)
      fonteBola = buf.find(b => b && b.length) || null;
    if (fonteBola && fonteBola.length)
      bola = foraDoDesenho(fonteBola[fonteBola.length-1]);
  }
  vAgora = buf.map(b => velocidade(b, agora));
  vAgora.forEach((v, i) => { const pp = saude.porPonto[i]; if (pp) pp.vPico = Math.max(pp.vPico, v); });
  return aceitas.length;
}

function processaQuadro(leituras, agora, escalaBruta){
  observa(leituras, agora, escalaBruta);

  /* 2. assentando: ninguém é candidato */
  if (fase === "assentando"){
    if (agora < assentaAte) return;
    limpaBuffers();
    vAgora = buf.map(() => 0);
    fase = "procurando";
    return;
  }

  /* 3. procurando: o primeiro a cruzar o limiar vence; no mesmo quadro, o mais rápido */
  if (fase === "procurando"){
    let venc = -1, vVenc = 0;
    for (let i=0; i<buf.length; i++){
      if (vAgora[i] >= V_ATIVA() && vAgora[i] > vVenc){ venc = i; vVenc = vAgora[i]; }
    }
    if (venc < 0) return;
    const b = buf[venc];
    /* vindo de uma virada, o buffer desse ponto já começa no ápice: abrir dali
       recupera os quadros que a janela de velocidade levou para reconhecer o
       gesto novo. Nos outros casos, o recuo curto de sempre. */
    const desde = (venc === retomada) ? 0 : Math.max(0, b.length-1-RETRO);
    retomada = -1;
    ativo = { ponto:venc, pts:b.slice(desde).map(p => ({...p})),
              t0:agora, lentoDesde:0, vPico:vVenc };
    fase = "ativo";
    return;
  }

  /* 4. ativo: só este ponto existe */
  const i = ativo.ponto, b = buf[i];
  if (!b.length){ fixa(agora, "ponto perdido"); return; }
  saude.quadrosAtivos++;
  saude.maxSimultaneos = Math.max(saude.maxSimultaneos, 1);

  const p = b[b.length-1], u = ativo.pts[ativo.pts.length-1];
  if (!u || Math.hypot(p.x-u.x, p.y-u.y) > 0.5) ativo.pts.push({...p});
  atualizaVivo();               // etapa 5.3 — o traço nasce durante o gesto

  /* movimento dos outros: contado só para o diagnóstico, nunca desenhado */
  let houveSilencio = false;
  for (let k=0; k<buf.length; k++){
    if (k === i) continue;
    if (vAgora[k] >= V_ATIVA()){ silenciados[k] = (silenciados[k]||0) + 1; houveSilencio = true; }
  }
  if (houveSilencio) saude.quadrosSilenciando++;

  const v = vAgora[i];
  ativo.vPico = Math.max(ativo.vPico, v);

  /* 4a · a virada fecha o episódio antes da parada.
     Só depois de o episódio já valer um traço (COMP_MIN): sem essa guarda, uma
     oscilação no começo partiria o gesto em fragmentos que morrem por percurso
     curto — trocaria um episódio grande demais por nenhum. */
  if (percurso(ativo.pts) >= COMP_MIN){
    const ape = viradaEm(b);
    if (ape){
      fixa(agora, "virada", ape.t);
      b.splice(0, ape.i);          // o buffer recomeça no ápice
      return;
    }
  }

  /* 4b · o arco encheu. Sem isto, um gesto de 285° é desenhado com 161° e os
     124° restantes ficam sem traço nenhum em cima — medido numa captura real,
     fuga de 43,7 espessuras com o span preso no teto. Fechando aqui, o gesto
     vira dois arcos que se encontram, que é como a fonte é feita. */
  /* o gatilho olha o span CRU do ajuste, não o do arco: o do arco já vem preso
     entre 25° e 210° e chega no teto tarde demais — medido, um trecho de 218°
     fechando com o arco desenhado em 129°. */
  if (CORRENTE && vivo && (vivo.spanBruto || 0) >= MEDIAN_EXTENT){
    fixa(agora, "arco cheio", agora);
    b.splice(0, Math.max(0, b.length - 3));   // recomeça daqui, com um fio de recuo
    return;
  }

  /* 4b-bis · o arco chegou na borda do palco. Antes isto virava um arrasto para
     dentro; agora fecha o traço, e o próximo nasce da mão onde ela está. */
  if (CORRENTE && vivo && saiuDoDesenho(vivo)){
    fixa(agora, "arco cheio", agora);
    b.splice(0, Math.max(0, b.length - 3));
    return;
  }

  /* 4c · e o teto de TEMPO, que não depende de reconhecer nada. O corte por span
     conta ângulo com sinal: um vaivém não o faz crescer, e o episódio engorda sem
     nunca encher — medido, volta 3,6 num episódio só. Meio segundo é meio
     segundo. */
  if (agora - ativo.t0 >= tracoAgora()){
    fixa(agora, "arco cheio", agora);        // mesmo tratamento: herda e continua
    b.splice(0, Math.max(0, b.length - 3));
    return;
  }

  if (v < V_PAUSA()){
    if (!ativo.lentoDesde) ativo.lentoDesde = agora;
    else if (agora - ativo.lentoDesde >= PAUSA_MS) fixa(agora, "pausa");
  } else ativo.lentoDesde = 0;
}

/* ===================== desenho =====================
   ETAPA 1. Em modo normal não há nada a desenhar: o arco é da etapa 2 e o rastro
   cru não pode aparecer (§1, §6 — "rastro de posições visível durante a captura"
   produz dois registros simultâneos da mesma coisa). O dado cru existe só sob o
   diagnóstico, e com selo dizendo que é dado cru. */
let diagLigado = false;

function pintaCru(){
  const lm = cruAtual;
  if (lm){
    ctx.fillStyle = "#3A3A3A";
    for (const q of lm){
      ctx.beginPath(); ctx.arc((1-q.x)*W, q.y*H, 2.5, 0, 7); ctx.fill();
    }
  }
  /* os pontos monitorados, com a velocidade de cada um */
  buf.forEach((b, i) => {
    if (!b.length) return;
    const p = b[b.length-1];
    const eAtivo = ativo && ativo.ponto === i;
    ctx.strokeStyle = eAtivo ? "#FFFFFF" : (vAgora[i] >= V_ATIVA() ? "#FF5A5A" : "#6E93FF");
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, eAtivo ? 11 : 7, 0, 7); ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(Math.round(vAgora[i]) + " px/s", p.x + 14, p.y + 4);
  });
  /* o rastro do episódio ativo — dado de entrada, exibido como pontos soltos
     justamente para não parecer um desenho */
  if (ativo && ativo.pts.length){
    ctx.fillStyle = "#FFFFFF";
    for (const q of ativo.pts){ ctx.beginPath(); ctx.arc(q.x, q.y, 1.6, 0, 7); ctx.fill(); }
  }
  /* cada episódio fixado na SUA cor, e o arco que saiu dele com um fio da mesma
     cor por dentro do traço branco. É o pareamento: um arco perdido é um arco
     cuja cor não está em cima dos próprios pontos. */
  for (const e of episodios){
    if (!e.aceito || !e.pts) continue;
    ctx.fillStyle = corDoEpisodio(e);
    for (const q of e.pts){ ctx.beginPath(); ctx.arc(q.x, q.y, 1.4, 0, 7); ctx.fill(); }
  }
  const q = molduraDes || moldura;
  ctx.save();
  ctx.setTransform(q.k, 0, 0, q.k, q.dx, q.dy);
  ctx.lineWidth = Math.max(0.8, 1.6/q.k);
  for (const a of composicao){
    ctx.strokeStyle = a.vivo ? "#FFFFFF" : corDoEpisodio(a.episodio);
    tracaArco(a);
  }
  /* e um fio ligando o meio do arco ao meio do trecho de gesto, quando os dois
     não estão no mesmo lugar — é a distância que o número "fuga" mede */
  ctx.setLineDash([3/q.k, 3/q.k]);
  for (const a of composicao){
    if (!a.trecho || !a.trecho.length) continue;
    const g = desenhoDe(a), ang = g.a0 + g.s*g.span/2;
    const M = { x:g.ox + Math.cos(ang)*g.r, y:g.oy + Math.sin(ang)*g.r };
    const G = a.trecho[Math.floor(a.trecho.length/2)];
    if (Math.hypot(M.x-G.x, M.y-G.y) < espessuraDe(composicao)) continue;
    ctx.strokeStyle = a.vivo ? "#FFFFFF" : corDoEpisodio(a.episodio);
    ctx.beginPath(); ctx.moveTo(M.x, M.y); ctx.lineTo(G.x, G.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function pontosDoArco(a, N = 64){
  const out = [];
  for (let i=0; i<=N; i++){
    const ang = a.a0 + a.s*a.span*i/N;
    out.push({ x: a.ox + Math.cos(ang)*a.r, y: a.oy + Math.sin(ang)*a.r });
  }
  return out;
}
/* espessura: §5.5 diz raio/30 (1:18 da fonte fica gordo nesta escala). A fonte é
   MONOLINEAR — uma espessura só no alfabeto inteiro — então a composição usa um
   número só, do raio médio, e não uma espessura por arco. */
function espessuraDe(arcos){
  if (!arcos.length) return VIEW_MIN*0.25*WIDTH_RATIO;
  const m = arcos.reduce((a,x) => a + x.r, 0)/arcos.length;
  return m*WIDTH_RATIO;
}
function enquadra(arcos, esp){
  if (!arcos.length) return {k:1, dx:0, dy:0};
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  for (const a of arcos) for (const q of pontosDoArco(a)){
    x0=Math.min(x0,q.x); x1=Math.max(x1,q.x); y0=Math.min(y0,q.y); y1=Math.max(y1,q.y);
  }
  const m = esp/2;                       // o terminal redondo não pode ser cortado
  x0-=m; y0-=m; x1+=m; y1+=m;
  const cw = x1-x0 || 1, ch = y1-y0 || 1, MARGEM = 0.11;
  const k = Math.min(2.5, (W*(1-2*MARGEM))/cw, (H*(1-2*MARGEM))/ch);
  return { k, dx: W/2 - (x0+x1)/2*k, dy: H/2 - (y0+y1)/2*k };
}
/* a geometria que APARECE. Sem a camada de inércia semeada, é a própria alvo —
   e é por isso que ?anima=0 devolve exatamente o desenho de antes. */
const desenhoDe = a => a.des || a;
function tracaArco2(c, a){
  const g = desenhoDe(a);
  c.beginPath();
  c.arc(g.ox, g.oy, g.r, g.a0, g.a0 + g.s*g.span, g.s < 0);
  c.stroke();
}
function tracaArco(a){ tracaArco2(ctx, a); }
/* ===================== a fuga =====================
   A pergunta que nenhuma medida deste arquivo respondia: o traço que está na
   tela passa por onde a mão passou?

   Todas as outras medidas são do AJUSTE — o desvio do círculo de mínimos
   quadrados, que diz se o gesto cabe num arco. Mas entre o ajuste e o desenho a
   §5.5 mexe em duas coisas de propósito: o raio medido vira raio de fonte
   (0,20–0,32 de viewMin, 144–230px aqui) e o span é preso entre 25° e 210°. Um
   gesto de raio 600px vira um arco de 230px ancorado no ponto médio — cabe
   perfeitamente num círculo, desvio de 2%, e mesmo assim sai de cima do
   movimento. É esse traço que parece perdido, e ele estava invisível para o
   diagnóstico porque todo número existente dizia que estava tudo bem.

   Fuga = a distância de cada ponto do trecho de gesto até o arco desenhado. Em
   espessuras, porque é assim que o olho lê: meia espessura é o traço em cima do
   movimento; dez espessuras é um arco solto perto de um gesto. */
function fugaDoArco(a){
  const t = a.trecho;
  if (!t || t.length < 2) return null;
  const g = desenhoDe(a), pts = pontosDoArco(g, 64);
  /* contra o gesto JÁ LEVADO PARA O PALCO, não contra a posição crua na tela.
     Desde que o desenho passou a ser abstraído de propósito — a distância ao
     centro deixou de ser fiel —, medir contra a posição crua marcaria como erro
     justamente o que foi pedido. O que continua valendo perguntar é: dentro da
     abstração, o arco representa o movimento? */
  const ds = t.map(paraOPalco).map(q => {
    let d = Infinity;
    for (const u of pts) d = Math.min(d, (q.x-u.x)*(q.x-u.x) + (q.y-u.y)*(q.y-u.y));
    return Math.sqrt(d);
  }).sort((x,y) => x-y);
  return { mediana: ds[Math.floor(ds.length/2)], pior: ds[ds.length-1] };
}

/* cores por episódio, para o diagnóstico poder emparelhar arco e gesto no olho.
   Um arco perdido é um arco cuja cor não está em cima dos próprios pontos. */
const CORES_EP = ["#5C7BFF", "#FF5A5A", "#4ADE80", "#FBBF24", "#E879F9", "#22D3EE"];
const corDoEpisodio = e => {
  const i = e ? episodios.indexOf(e) : -1;
  return i < 0 ? "#8A8A8A" : CORES_EP[i % CORES_EP.length];
};

/* ===================== a perseguição =====================
   Semear é dar à geometria desenhada um ponto de partida; animar é levá-la até a
   alvo. Um arco que JÁ está desenhado nunca é resemeado — ele desliza de onde
   está para onde passou a ser. É o "nascem, se refinam, nunca são trocados" da
   §6, escrito como código.

   O ponto de partida de um arco recém-nascido é a geometria do próprio ajuste,
   antes da coesão e antes das juntas: o arco aparece onde o gesto o pôs e só
   então se junta aos outros. Nada é inventado para a animação — os dois extremos
   já existiam, guardados em baseOx/baseOy e baseStart/baseExtent. */
const pontaInicial = g => ({ x: g.ox + Math.cos(g.a0)*g.r, y: g.oy + Math.sin(g.a0)*g.r });

/* Puxa o arco para dentro do disco do desenho, por TRANSLAÇÃO: forma, raio,
   extensão e orientação intactos, só a posição cede. Devolve o quanto andou,
   para a âncora andar junto e o traço continuar crescendo de onde nasceu. */
/* o arco já passou do disco do desenho? */
function saiuDoDesenho(a){
  const cx = W/2, cy = H/2;
  for (const q of pontosDoArco(a, 32))
    if (Math.hypot(q.x-cx, q.y-cy) > DESENHO_RAIO) return true;
  return false;
}

function contemNoDesenho(a, raio = NASCE_RAIO){
  const cx = W/2, cy = H/2;
  let pior = 0, px = 0, py = 0;
  for (const q of pontosDoArco(a, 32)){
    const d = Math.hypot(q.x-cx, q.y-cy);
    if (d > pior){ pior = d; px = q.x; py = q.y; }
  }
  if (pior <= raio) return { dx:0, dy:0 };
  const e = Math.hypot(px-cx, py-cy) || 1;
  const recuo = pior - raio;
  const dx = -(px-cx)/e*recuo, dy = -(py-cy)/e*recuo;
  a.ox += dx; a.oy += dy; a.baseOx += dx; a.baseOy += dy;
  return { dx, dy };
}

/* O ponto de repouso, posto FORA do desenho: direção da mão, distância ditada
   pelo alcance da composição. */
/* O raio em que o ponto fica livre da tinta numa dada direção. Separado de
   propósito: é chamado tanto para o ALVO (direção da mão) quanto, a cada quadro,
   para a posição DESENHADA — e é essa segunda chamada que transforma "o alvo
   está fora" em "o ponto está fora", sempre. Sem ela, a bola chega ao alvo com o
   atraso da inércia e o desenho cresce por cima dela no caminho: medido, ela
   raspava a 0,2px de um arco. */
function raioLivreEm(ux, uy, tinta, livre, teto){
  let r = 0;
  for (const q of tinta){
    const proj = (q.x-W/2)*ux + (q.y-H/2)*uy;
    if (proj <= 0) continue;
    if (Math.abs((q.x-W/2)*(-uy) + (q.y-H/2)*ux) > livre) continue;   // fora do caminho
    r = Math.max(r, proj);
  }
  return Math.min(teto, (r > 0 ? r : PALCO_RAIO) + livre);
}

function tintaDoDesenho(){
  const t = [];
  for (const a of composicao) for (const q of pontosDoArco(desenhoDe(a), 28)) t.push(q);
  return t;
}
const folgaDaBola = esp => esp/2 + esp*BOLA_RAIO + esp*BOLA_FOLGA;
const tetoDaBola  = esp => VIEW_MIN/2 - esp*BOLA_RAIO - VIEW_MIN*BOLA_MARGEM;

function foraDoDesenho(mao){
  const cx = W/2, cy = H/2;
  const esp = espessuraDe(composicao);
  const raioB = esp*BOLA_RAIO;
  const teto = tetoDaBola(esp);

  /* a direção é da mão; se ela estiver no centro, guarda a última */
  let dx = mao.x - cx, dy = mao.y - cy;
  let d = Math.hypot(dx, dy);
  if (d < 1e-6 && bola){ dx = bola.x - cx; dy = bola.y - cy; d = Math.hypot(dx, dy); }
  if (d < 1e-6){ dx = 0; dy = -1; d = 1; }
  const ux = dx/d, uy = dy/d;

  /* A DISTÂNCIA é ditada pela TINTA, não pelo alcance do desenho. "Fora do
     círculo que contém tudo" não funciona: numa composição real o desenho chega
     a 341px num quadro cuja metade é 360, e não sobra órbita — o ponto era
     empurrado para a borda e mesmo assim ficava por dentro.
     O que a cliente quer é o ponto não se misturar com os traços. Então o
     critério é a tinta NAQUELA DIREÇÃO: anda pelo raio, acha o ponto mais
     distante onde ainda há traço, e para logo depois dele. Onde o desenho é
     denso o ponto vai longe; onde é vazio ele fica perto, e continua isolado. */
  const tinta = tintaDoDesenho();
  const livre = folgaDaBola(esp);
  const alcanceEm = (vx, vy) => raioLivreEm(vx, vy, tinta, livre, Infinity) - livre;

  /* A DIREÇÃO PODE CEDER. Numa composição real o desenho chega a 341px num
     quadro cuja metade útil é 322: em algumas direções não existe "fora", e
     insistir na direção da mão punha o ponto em cima de um traço. Então procura
     a direção mais PRÓXIMA da mão em que ele caiba — no máximo um quarto de
     volta para cada lado. A mão continua mandando; ela só deixa de mandar
     sozinha quando o desenho não deixa espaço. */
  const ang0 = Math.atan2(uy, ux);
  let melhor = null;
  for (let passo = 0; passo <= 30; passo++){
    for (const lado of (passo === 0 ? [0] : [1, -1])){
      const ang = ang0 + lado*passo*(3*Math.PI/180);
      const vx = Math.cos(ang), vy = Math.sin(ang);
      const r = alcanceEm(vx, vy);
      const folgaSobra = teto - (r + livre);
      if (folgaSobra >= 0) return { x: cx + vx*(r + livre), y: cy + vy*(r + livre) };
      if (!melhor || folgaSobra > melhor.f) melhor = { f:folgaSobra, vx, vy, r };
    }
  }
  /* nenhuma direção comporta: fica na menos apertada, no limite da cena */
  return { x: cx + melhor.vx*teto, y: cy + melhor.vy*teto };
}
const geometriaDeNascimento = a => ({
  ox:a.baseOx, oy:a.baseOy, r:a.r, a0:a.baseStart, s:a.s, span:a.baseExtent });

function semeiaDesenho(){
  if (!ANIMA || !composicao.length) return;
  for (const a of composicao) if (!a.des) a.des = geometriaDeNascimento(a);
  /* O ENQUADRAMENTO DESENHADO PARTE DO ATUAL, não de um enquadramento calculado.
     Este era o erro que fazia o traço "flutuar e não seguir a mão": semear com
     enquadra() dos arcos significava que, no instante em que o primeiro arco
     nascia, a cena dava um zoom para enquadrá-lo — 2,17× medido, com a origem
     deslocada em (−518, −628). A mão, que está em coordenadas de tela, ia parar
     231px ACIMA do topo do canvas. O traço estava colado na mão o tempo todo, em
     coordenadas de composição; quem tinha ido embora era a câmera.
     Partindo do enquadramento em vigor, nada se mexe enquanto ele não mudar — e
     ele só muda no fim da captura, que é quando o zoom deve acontecer. */
  if (!molduraDes) molduraDes = { ...moldura };
}

const encurta = d => { while (d >  Math.PI) d -= 2*Math.PI;
                       while (d < -Math.PI) d += 2*Math.PI; return d; };

/* o erro que falta percorrer, em PIXELS — inclusive o dos ângulos, convertido
   pelo raio. Um span 2° fora num arco de 200px são 7px de ponta fora do lugar, e
   é a ponta que a pessoa vê. */
function erroDoDesenho(){
  let e = 0;
  for (const a of composicao){
    const g = a.des; if (!g) continue;
    e = Math.max(e, Math.hypot(g.ox-a.ox, g.oy-a.oy),
                    Math.abs(encurta(a.a0-g.a0))*a.r,
                    Math.abs(a.span-g.span)*a.r);
  }
  if (molduraDes)
    e = Math.max(e, Math.abs(molduraDes.k-moldura.k)*VIEW_MIN,
                    Math.abs(molduraDes.dx-moldura.dx),
                    Math.abs(molduraDes.dy-moldura.dy));
  return e;
}

function assenta(){
  for (const a of composicao) a.des = null;
  molduraDes = null;                     // volta a ler a alvo: repouso idêntico
}

/* UM passo da perseguição. Fica fora do laço de propósito: é assim que ela pode
   ser medida sem depender do relógio do navegador — com a janela em segundo
   plano o requestAnimationFrame cai para ~1 quadro por segundo e a animação
   parece travada quando na verdade está correndo devagar. Devolve true quando
   chegou. */
/* O ponto de repouso anda TODO QUADRO, esteja ou não algum arco em movimento.
   Estava dentro de passoDeInercia, que só roda quando há arco animando — então,
   assim que a composição assentava, a bola congelava com a posição velha e o
   desenho crescia por cima dela. Medido: encostava a 4,4px de um arco. */
function passoDaBola(k){
  if (!bola) return;
  if (!bolaDes){ bolaDes = { x:bola.x, y:bola.y }; return; }
  const cx = W/2, cy = H/2;
  const aAlvo = Math.atan2(bola.y-cy, bola.x-cx);
  let aDes = Math.atan2(bolaDes.y-cy, bolaDes.x-cx);
  aDes += encurta(aAlvo - aDes)*k;             // só o ÂNGULO persegue
  /* o RAIO não persegue: é recalculado na direção desenhada, todo quadro. É o
     que garante que o ponto esteja fora da tinta AGORA, e não só quando
     alcançar o alvo. */
  const esp = espessuraDe(composicao);
  const rDes = composicao.length
    ? raioLivreEm(Math.cos(aDes), Math.sin(aDes), tintaDoDesenho(), folgaDaBola(esp), tetoDaBola(esp))
    : Math.hypot(bola.x-cx, bola.y-cy);
  bolaDes.x = cx + Math.cos(aDes)*rDes;
  bolaDes.y = cy + Math.sin(aDes)*rDes;
}

function passoDeInercia(dt = 16.7){
  const k = 1 - Math.exp(-Math.max(1, Math.min(100, dt))/INERCIA_TAU);
  const teto = espessuraDe(composicao)*INERCIA_TETO*dt/1000;
  for (const a of composicao){
    const g = a.des; if (!g) continue;
    let dx = (a.ox - g.ox)*k, dy = (a.oy - g.oy)*k;
    let dr = (a.r - g.r)*k, dsp = (a.span - g.span)*k;
    let da = encurta(a.a0 - g.a0)*k;

    /* O ARCO VIVO NÃO ATRASA A EXTENSÃO. Enquanto o gesto acontece, o span é
       "até onde a mão já foi" — atrasá-lo deixa o traço curto e a mão longe da
       ponta, que foi exatamente a queixa: ele flutua, não segue a mão. O que
       atrasa é o CÍRCULO (centro e raio), que é a forma se acomodando enquanto
       o ajuste ainda muda de ideia. A ponta acompanha; o corpo amacia.
       Quando o episódio fecha o arco deixa de ser vivo e volta a atrasar tudo,
       porque aí o que se move é a composição se reacomodando — e essa sim
       precisa deslizar. */
    if (a.vivo){ dsp = a.span - g.span; da = encurta(a.a0 - g.a0); }
    /* O teto mede o PONTO MÉDIO do arco, e essa escolha é o que separa crescer de
       deslizar. arcoDeTrecho ancora o arco no meio do trecho de gesto: quando o
       gesto se estende, as duas pontas abrem em volta do meio e o ponto médio
       fica praticamente parado. Quando o arco desliza, ele vai junto.
       Frear a geometria toda foi a primeira versão, e foi medida: a ponta
       desenhada ficava 210px atrás do ajuste (máx 448), porque esticar 300px de
       arco a 5,9px por quadro leva 50 quadros e o gesto inteiro dura 20 — o
       traço não alcançava a mão nunca. Soltar span e início foi a segunda, e
       também foi medida: 241px num quadro só, com um arco recém-nascido
       deslizando ao longo do próprio círculo. O ponto médio é o que responde
       "o que já estava na tela se mexeu?", que é a pergunta de verdade. */
    const meio = q => { const ang = q.a0 + q.s*q.span/2;
                        return { x:q.ox + Math.cos(ang)*q.r, y:q.oy + Math.sin(ang)*q.r }; };
    if (!a.vivo){
      const antes = meio(g);
      const depois = meio({ ox:g.ox+dx, oy:g.oy+dy, r:g.r+dr,
                            a0:g.a0+da, s:a.s, span:g.span+dsp });
      const m = Math.hypot(depois.x-antes.x, depois.y-antes.y);
      if (m > teto){                     // encolhe TUDO na mesma proporção: o arco
        const f = teto/m;                // desacelera sem se deformar no caminho
        dx*=f; dy*=f; dr*=f; dsp*=f; da*=f;
      }
    } else {
      /* no arco vivo o teto vale só para o círculo: as pontas são o gesto */
      const m = Math.max(Math.hypot(dx, dy), Math.abs(dr));
      if (m > teto){ const f = teto/m; dx*=f; dy*=f; dr*=f; }
    }
    g.ox += dx; g.oy += dy; g.r += dr; g.span += dsp; g.a0 += da;
    g.s = a.s;
  }
  passoDaBola(k);
  if (molduraDes){
    let dk = (moldura.k - molduraDes.k)*k;
    let ddx = (moldura.dx - molduraDes.dx)*k, ddy = (moldura.dy - molduraDes.dy)*k;
    const m = Math.max(Math.abs(dk)*VIEW_MIN, Math.hypot(ddx, ddy));
    if (m > teto){ const f = teto/m; dk*=f; ddx*=f; ddy*=f; }
    molduraDes.k += dk; molduraDes.dx += ddx; molduraDes.dy += ddy;
  }
  if (erroDoDesenho() >= INERCIA_PARA) return false;
  assenta();                             // o repouso volta a ler a geometria alvo
  return true;
}

let animando = 0, ultimoQuadro = 0;
function animaComposicao(){
  if (!ANIMA || !composicao.length){ pinta(); return; }
  semeiaDesenho();
  if (estado === "grava") return;        // durante a captura quem anda é laco()
  if (animando) return;                  // já há um laço correndo; ele segue o alvo novo
  let ant = 0;
  animando = requestAnimationFrame(function passo(t){
    const dt = ant ? t - ant : 16.7; ant = t;
    const chegou = passoDeInercia(dt);
    pinta();
    animando = chegou ? 0 : requestAnimationFrame(passo);
  });
}

/* UMA tinta, UMA espessura, alfa cheio. Nenhum arco é "passado": o resultado tem
   de ler como uma imagem só. Terminal semicircular = lineCap round (§4). */
/* O ponto de repouso. FORA do filtro gooey de propósito: no esboço do símbolo
   ele é um ponto sólido ISOLADO à parte, não um nó fundido nos arcos. */
function pintaBola(esp, q, alfa){
  const b = bolaDes || bola;
  if (!b) return;
  ctx.save();
  ctx.setTransform(q.k, 0, 0, q.k, q.dx, q.dy);
  ctx.globalAlpha = alfa;
  ctx.fillStyle = "#FFFFFF";
  /* o raio é em espessuras DE TELA, então dividido pela escala do enquadramento
     — a bola não muda de tamanho quando a composição muda de escala. */
  ctx.beginPath(); ctx.arc(b.x, b.y, esp*BOLA_RAIO/q.k, 0, 7); ctx.fill();
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
}

function pintaComposicao(alfa = 1){
  if (!composicao.length) return;
  /* a espessura sai do raio, e a coesão e as juntas nunca mexem em raio: ela é a
     mesma na geometria alvo e na desenhada. O ENQUADRAMENTO não — ele persegue,
     porque a caixa da composição muda enquanto os arcos deslizam. */
  const esp = espessuraDe(composicao), q = molduraDes || moldura;

  if (!GOO_LIGADO){
    ctx.setTransform(q.k, 0, 0, q.k, q.dx, q.dy);
    ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = esp/q.k;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.globalAlpha = alfa;
    for (const a of composicao) tracaArco(a);
    ctx.setTransform(1,0,0,1,0,0);
    pintaBola(esp, q, alfa);
    return;
  }

  /* o sigma do blur segue a espessura NA TELA, depois do enquadramento: o filtro
     opera em pixels do canvas, não em unidades da composição */
  const espTela = esp;
  document.querySelector("#plc-goo feGaussianBlur")
          .setAttribute("stdDeviation", String(espTela*GOO_BLUR_RATIO));

  octx.setTransform(1,0,0,1,0,0);
  octx.clearRect(0, 0, W, H);
  octx.setTransform(q.k, 0, 0, q.k, q.dx, q.dy);
  octx.strokeStyle = "#FFFFFF";
  octx.lineWidth = espTela/q.k;
  octx.lineCap = "round"; octx.lineJoin = "round";
  /* DENTRO DO OFFSCREEN, ALFA 1 EM TUDO. Qualquer fade ou revelação progressiva
     com alfa parcial é apagado inteiro pelo limiar do gooey — o degrau de alfa não
     distingue "meio transparente de propósito" de "borda espalhada pelo blur".
     O fade entra depois do filtro, no desenho do offscreen para a tela. */
  octx.globalAlpha = 1;
  for (const a of composicao) tracaArco2(octx, a);
  /* o filete, só onde há junta de verdade: o ponto de cruzamento que a §5.3
     calculou e validou dentro do span dos dois arcos. Entra ANTES do filtro,
     para o limiar fundir disco e traços num contorno só — desenhado depois, seria
     um círculo colado por cima. */
  if (GOO_FILETE > 0){
    const R = (esp/q.k)*GOO_FILETE;
    octx.fillStyle = "#FFFFFF";
    /* recalculado sobre a geometria DESENHADA, não sobre a que a §5.3 guardou:
       enquanto os arcos deslizam, a junta está onde os traços se cruzam agora. */
    for (const X of cruzamentosDe(composicao.map(desenhoDe))){
      octx.beginPath(); octx.arc(X.x, X.y, R, 0, 7); octx.fill();
    }
  }
  octx.setTransform(1,0,0,1,0,0);

  /* a fusão acontece com alfa 1, num buffer próprio */
  o2ctx.setTransform(1,0,0,1,0,0);
  o2ctx.clearRect(0, 0, W, H);
  o2ctx.save();
  o2ctx.filter = "url(#plc-goo)";
  o2ctx.globalAlpha = 1;
  o2ctx.drawImage(off, 0, 0);
  o2ctx.restore();

  /* e só então o fade, sobre o resultado já fundido, sem filtro no caminho */
  ctx.save();
  ctx.filter = "none";
  ctx.globalAlpha = alfa;
  ctx.drawImage(off2, 0, 0);
  ctx.restore();

  pintaBola(esp, q, alfa);
}

/* ===================== o registrador de movimento =====================
   Quatro hipóteses minhas sobre "o traço flutua" morreram contra a medição, e
   todas as quatro foram testadas com gestos SINTÉTICOS. A captura real é que
   tem de responder. Este registrador anda a cada quadro e guarda, por arco,
   quanto a linha DESENHADA se mexeu depois de nascer — separando o que ela
   cresceu do que ela andou.

   "Andar" aqui é o deslocamento do ponto mais próximo: para cada ponto da linha
   de um quadro, a distância até o ponto mais próximo da linha do quadro
   anterior. Crescer não conta (o que já existia continua onde estava); deslizar
   conta inteiro. É a mesma medida que separa as duas coisas no teste de salto. */
function registraMovimento(){
  for (const a of composicao){
    const g = desenhoDe(a);
    const pts = pontosDoArco(g, 16);
    if (a._ant){
      let pior = 0;
      for (const u of a._ant){
        let d = Infinity;
        for (const v of pts) d = Math.min(d, (u.x-v.x)*(u.x-v.x) + (u.y-v.y)*(u.y-v.y));
        pior = Math.max(pior, Math.sqrt(d));
      }
      a.andouMax = Math.max(a.andouMax || 0, pior);
      a.andouTotal = (a.andouTotal || 0) + pior;
      /* três momentos, não dois. "No fechamento" é a regra das juntas dando ao
         arco a sua junta — faz parte de ficar pronto. "Depois" é o desenho
         mudando sozinho, e esse tem de ser zero. */
      if (a.vivo)            a.andouVivo = Math.max(a.andouVivo || 0, pior);
      else if (!a._fechou){  a.andouFecho = Math.max(a.andouFecho || 0, pior); a._fechou = true; }
      else                   a.andouDepois = Math.max(a.andouDepois || 0, pior);
    }
    a._ant = pts;
  }
}

function pinta(){
  registraMovimento();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#0A0A0A"; ctx.fillRect(0, 0, W, H);
  /* a composição aparece DURANTE a captura: os arcos nascem quando cada gesto
     fecha. O rastro cru continua fora (§1, §6) — só o arco. */
  if (estado === "grava" || estado === "resultado" || modoDedo) pintaComposicao();
  if (diagLigado && (estado === "calibra" || estado === "grava" || estado === "resultado")) pintaCru();
  $("selo").hidden = !(diagLigado && estado !== "repouso");
  const hud = $("fase-hud");
  hud.hidden = !(diagLigado && (estado === "grava" || estado === "calibra"));
  if (!hud.hidden) hud.textContent = estado === "calibra" ? "calibragem"
                 : fase + (ativo ? " · " + nomeDe(ativo.ponto) : "");
}

/* ===================== diagnóstico ===================== */
const num = (v, c=0) => (v==null || !isFinite(v)) ? "—" : v.toFixed(c);
function pct(vs, q){
  if (!vs || !vs.length) return null;
  const a = [...vs].sort((x,y) => x-y);
  return a[Math.min(a.length-1, Math.floor(q*a.length))];
}

/* ===================== o diagnóstico de celular =====================
   Medir no celular é fácil; TIRAR O DADO DE LÁ é que não é. Copiar uma linha de
   600 caracteres numa tela de 390px é inviável, não há console, e as tabelas do
   painel têm 480px de largura mínima. Então o diagnóstico de celular é duas
   coisas: um bloco curto com o que só importa nele, e um jeito de mandar isso
   embora com um toque.

   O que ele mede e o painel de mesa não media:
   · fps REAL — quase tudo depende dele, e no celular ele é metade
   · o que a câmera ENTREGOU contra o que foi pedido (640×480 deitado): num
     aparelho em pé o navegador pode dar outra coisa
   · a cena fixa de 960×720 contra o tamanho em que ela aparece no aparelho
   · quanto do quadro a mão ocupa — é o que explica ombros bater no teto de 700
   · o teto de traço em vigor, que é adaptativo e no celular vive encolhido */
const ECRA_ESTREITO = () =>
  innerWidth < 700 || (matchMedia && matchMedia("(pointer:coarse)").matches);

function medidasDoAparelho(){
  const r = tela.getBoundingClientRect();
  const dur = (saude.t1 - saude.t0)/1000;
  return {
    fps: dur > 0.2 ? saude.quadros/dur : null,
    aparelho: `${innerWidth}×${innerHeight}`,
    dpr: (devicePixelRatio || 1).toFixed(1),
    orientacao: innerHeight >= innerWidth ? "em pé" : "deitado",
    camera: video && video.videoWidth ? `${video.videoWidth}×${video.videoHeight}` : "—",
    cena: `${W}×${H}`,
    cenaNaTela: `${Math.round(r.width)}×${Math.round(r.height)}`,
    /* a mão ocupa quanto do quadro? ombros é 4× a medida punho–base do médio, e
       o teto de 700 é o sinal de que ela está colada na câmera */
    maoNoQuadro: (ombros/VIEW_MIN*100).toFixed(0) + "%",
    noTeto: ombros >= OMBROS_MAX - 1,
    traco: Math.round(tracoAgora()),
    util: saude.quadros ? (saude.comLeitura/saude.quadros*100).toFixed(0)+"%" : "—",
  };
}

function resumoDoCelular(){
  const m = medidasDoAparelho();
  return `CELULAR · ${m.aparelho} @${m.dpr}x ${m.orientacao} · fps ${num(m.fps,1)} · ` +
         `camera ${m.camera} · cena ${m.cena} em ${m.cenaNaTela} · ` +
         `mao ${m.maoNoQuadro} do quadro${m.noTeto?" (NO TETO)":""} · ` +
         `util ${m.util} · traco ${m.traco}ms · ombros ${num(ombros)}`;
}

function blocoDoCelular(){
  const m = medidasDoAparelho();
  const linha = (rot, val, aviso) =>
    `<div class="cel-linha${aviso?" cel-aviso":""}"><span>${rot}</span><b>${val}</b></div>`;
  return `<section class="cel">
    <h4>Aparelho</h4>
    <div class="cel-grade">
      ${linha("fps", num(m.fps,1), m.fps != null && m.fps < 24)}
      ${linha("quadros úteis", m.util, saude.quadros && saude.comLeitura/saude.quadros < 0.6)}
      ${linha("tela", m.aparelho + " @" + m.dpr + "x " + m.orientacao)}
      ${linha("câmera entregou", m.camera)}
      ${linha("cena", m.cena + " em " + m.cenaNaTela)}
      ${linha("mão no quadro", m.maoNoQuadro, m.noTeto)}
      ${linha("teto do traço", m.traco + "ms")}
      ${linha("escala do corpo", num(ombros) + (m.noTeto ? " no teto" : ""), m.noTeto)}
    </div>
    <button class="cel-botao" id="cel-manda">mandar diagnóstico</button>
    <p class="cel-nota">Um toque: abre o compartilhar do aparelho, ou copia se ele não tiver.</p>
  </section>`;
}

/* o caminho de volta: compartilhar nativo, com a área de transferência de
   reserva. É a parte que faz o diagnóstico de celular existir de verdade. */
async function mandaDiagnostico(botao){
  const texto = resumoDoCelular() + "\n\n" + ($("diag-resumo") ? $("diag-resumo").textContent : "");
  const avisa = t => { botao.textContent = t; setTimeout(() => botao.textContent = "mandar diagnóstico", 2200); };
  try{
    if (navigator.share){ await navigator.share({ title:"PALCO — diagnóstico", text:texto }); return; }
  }catch(e){ if (e && e.name === "AbortError") return; }
  try{
    await navigator.clipboard.writeText(texto);
    avisa("copiado ✓");
  }catch(e){
    /* sem permissão de área de transferência: deixa o texto selecionável */
    const cx = $("diag-resumo");
    if (cx){ const sel = getSelection(), r = document.createRange();
             r.selectNodeContents(cx); sel.removeAllRanges(); sel.addRange(r); }
    avisa("selecionado — copie");
  }
}

let cliqueLigado = false;
function pintaDiag(){
  const d = $("diag");
  if (d.hidden) return;
  if (!cliqueLigado){
    /* o innerHTML do painel é refeito a cada pintura, então o ouvinte não pode
       estar no botão: fica no pai, uma vez só */
    d.addEventListener("click", ev => {
      const b = ev.target.closest && ev.target.closest("#cel-manda");
      if (b) mandaDiagnostico(b);
    });
    cliqueLigado = true;
  }
  const dur = (saude.t1 - saude.t0)/1000;
  const aceitos = episodios.filter(e => e.aceito).length;

  const captura = modoDedo
    ? `<p>Modo dedo — sem câmera. A mesma máquina de estados, alimentada pelo ponteiro.</p>`
    : `<table>
        <tr><th>quadros do laço</th><td>${saude.quadros}</td>
            <th>com pose</th><td class="${saude.comPose?'passa':'morre'}">${saude.comPose}</td>
            <th>com ponto útil</th><td class="${saude.comLeitura?'passa':'morre'}">${saude.comLeitura}</td></tr>
        <tr><th>erros no laço</th><td class="${saude.erros?'morre':''}">${saude.erros}</td>
            <th>duração</th><td>${num(dur,1)}s</td>
            <th>amostragem</th><td>${num(dur>0 ? saude.comLeitura/dur : 0,1)} Hz</td></tr>
        <tr><th>leitura</th><td style="text-align:left">${fonte.rotulo}</td>
            <th>delegate</th><td>${delegateUsado}</td>
            <th>modelo</th><td style="text-align:left">${fonte.modelo}</td></tr>
       </table>
       ${saude.erros ? `<p class="morre">último erro: <code>${saude.ultimoErro}</code></p>` : ""}
       <p>“com pose” = o modelo achou um corpo. “com ponto útil” = pelo menos um ponto monitorado
          passou no corte de visibilidade ${VIS_MIN}. A diferença entre os dois é o gesto que existiu
          e não foi medido.</p>`;

  const restaAssenta = fase === "assentando" ? Math.max(0, assentaAte - relogio) : 0;
  const maquina = `
    <table>
      <tr><th>fase</th><td class="vivo" style="text-align:left">${fase}${restaAssenta ? " · "+num(restaAssenta)+"ms" : ""}</td>
          <th>ponto ativo</th><td style="text-align:left">${ativo ? nomeDe(ativo.ponto) : "—"}</td>
          <th>amostras</th><td>${ativo ? ativo.pts.length : 0}</td>
          <th>percurso</th><td>${ativo ? num(percurso(ativo.pts)) : 0} px</td></tr>
    </table>
    <table style="margin-top:6px">
      <tr><th>ponto</th><th>velocidade</th><th></th><th>estado</th>
          <th>pico</th><th>bruto</th><th>p10</th><th>p25</th><th>p50</th><th>p90</th><th>p99</th><th>saltos</th>
          <th>venceu</th><th>silenciado</th><th>visto</th><th>recusado</th><th>visib.máx</th></tr>
      ${MONITORADOS().map((f, i) => {
        const v = vAgora[i] || 0;
        const pp = saude.porPonto[i] || {visto:0, recusadoVis:0, vPico:0, visMax:0};
        const eAtivo = ativo && ativo.ponto === i;
        const cls = eAtivo ? "vivo" : (v >= V_ATIVA() ? "morre" : "");
        const est = eAtivo ? "ATIVO"
                  : fase === "assentando" ? "assentando"
                  : v >= V_ATIVA() ? (fase === "ativo" ? "silenciado" : "candidato")
                  : (buf[i] && buf[i].length ? "visto" : "ausente");
        const larg = Math.min(60, v/(V_ATIVA()*2)*60);
        return `<tr><td>${f.nome}</td>
          <td class="${cls}">${num(v)} px/s</td>
          <td style="text-align:left;width:64px"><span class="plc-barrinha" style="width:${larg}px;background:${v>=V_ATIVA()?'#FF5A5A':'#002FA7'}"></span></td>
          <td class="${cls}" style="text-align:left">${est}</td>
          <td class="${pp.vPico>=V_ATIVA()?'passa':'morre'}">${num(pp.vPico)}</td>
          <td class="${pp.vBruto>V_SALTO?'morre':''}">${num(pp.vBruto)}</td>
          <td>${num(pct(pp.vs,0.10))}</td>
          <td class="${pct(pp.vs,0.25)>V_ATIVA()?'morre':''}">${num(pct(pp.vs,0.25))}</td>
          <td>${num(pct(pp.vs,0.50))}</td>
          <td>${num(pct(pp.vs,0.90))}</td>
          <td class="${pct(pp.vs,0.99)>V_SALTO?'morre':''}">${num(pct(pp.vs,0.99))}</td>
          <td class="${pp.salto?'morre':''}">${pp.salto}</td>
          <td>${episodios.filter(e => e.ponto === i).length}</td>
          <td>${silenciados[i]||0}</td>
          <td class="${pp.visto?'':'morre'}">${pp.visto}</td>
          <td class="${pp.recusadoVis?'morre':''}">${pp.recusadoVis}</td>
          <td>${pp.visMax.toFixed(2)}</td></tr>`;
      }).join("")}
    </table>
    <p>abre em ${num(V_ATIVA())} px/s · fixa após ${PAUSA_MS}ms abaixo de ${num(V_PAUSA())} px/s ·
       ${ASSENTA_MS}ms de assentamento antes do próximo candidato · velocidade medida
       sobre ${JANELA_MS}ms.</p>`;

  const linhasEp = episodios.map((e, i) => `
    <tr style="${e.aceito?'font-weight:600':''}">
      <td>${e.aceito?"▪":"·"} ${i+1}</td>
      <td>${e.nome}</td>
      <td>${num((e.t0-saude.t0)/1000,2)}s</td>
      <td>${num((e.t1-e.t0))}ms</td>
      <td>${e.n}</td>
      <td>${num(e.comp)}</td>
      <td>${num(e.amp)}</td>
      <td>${e.fit ? num(e.fit.r) : "—"}</td>
      <td>${e.fit ? num(e.fit.span*180/Math.PI)+"°" : "—"}</td>
      <td>${e.fit ? num(e.fit.arco) : "—"}</td>
      <td>${e.fit && e.fit.volta ? e.fit.volta.toFixed(1)+"×" : "—"}</td>
      <td class="${e.fit ? (e.fit.rel<0.10?'passa':'morre') : ''}">${e.fit ? (e.fit.rel*100).toFixed(1)+"%" : "—"}</td>
      <td class="${e.fit&&e.fit.rel2!=null ? (e.fit.rel2<0.10?'passa':'morre') : ''}">${e.fit&&e.fit.rel2!=null ? (e.fit.rel2*100).toFixed(1)+"%" : "—"}</td>
      <td class="${e.fit&&e.fit.rel3!=null ? (e.fit.rel3<0.10?'passa':'morre') : ''}">${e.fit&&e.fit.rel3!=null ? (e.fit.rel3*100).toFixed(1)+"%" : "—"}</td>
      <td>${e.motivo}</td>
      <td class="${e.aceito?'passa':'morre'}">${e.aceito ? "capturado" : (e.comp < COMP_MIN ? "percurso curto" : "poucas amostras")}</td>
    </tr>`).join("") || `<tr><td colspan="10" class="morre">nenhum episódio</td></tr>`;

  const vPicoGeral = saude.porPonto.length ? Math.max(...saude.porPonto.map(p => p.vPico)) : 0;
  const algumVisto = saude.porPonto.some(p => p.visto > 0);
  const recusas = saude.porPonto.reduce((a,p) => a + p.recusadoVis, 0);
  /* um ponto visto não absolve os outros: se a cabeça aparece e os dois pulsos
     são recusados, o pico de velocidade é zero porque o que se moveu não estava
     sendo medido — e dizer "movimento lento demais" seria mentira. */
  const cegos = saude.porPonto
    .map((p, i) => ({ nome: MONITORADOS()[i] ? MONITORADOS()[i].nome : "?",
                      frac: saude.comPose ? p.recusadoVis/saude.comPose : 0 }))
    .filter(p => p.frac > 0.5);
  const avisoCego = cegos.length
    ? ` Atenção: ${cegos.map(c => c.nome+" ("+Math.round(c.frac*100)+"% dos quadros)").join(", ")} ${cegos.length>1?"ficaram":"ficou"} abaixo do corte de visibilidade — o pico pode estar baixo porque o ponto que se moveu não foi medido.`
    : "";

  /* uma porta de cada vez, na ordem em que o quadro atravessa o sistema, e cada
     uma com o número que a fechou. §6: o que travou uma sessão inteira foi ter
     quatro filtros em cadeia e nenhum deles dizendo qual zerou o resultado. */
  const veredito =
      !saude.quadros
        ? ["", "Nenhum quadro processado ainda."]
    : (!modoDedo && !saude.comPose)
        ? ["morre", `Porta 1 — a leitura de corpo. ${saude.quadros} quadro(s) do laço, nenhum com pose. O modelo rodou mas não achou ninguém: enquadramento, luz, ou o corpo perto demais da câmera. O gesto nem chegou a ser avaliado.`]
    : !algumVisto
        ? ["morre", `Porta 2 — a visibilidade. A pose foi lida em ${saude.comPose} quadro(s), mas nenhum ponto monitorado passou no corte de ${VIS_MIN} (${recusas} recusa(s)). Veja "visibilidade máx." na tabela abaixo: o ponto está fora do quadro ou encoberto.`]
    : (ativo && !episodios.length)
        ? ["vivo", `Traço vivo em ${nomeDe(ativo.ponto)} — ${ativo.pts.length} amostras, ${num(percurso(ativo.pts))}px de percurso.`]
    : !episodios.length
        ? ["morre", `Porta 3 — o limiar de velocidade. O pico da captura foi ${num(vPicoGeral)} px/s e o limiar é ${num(V_ATIVA())} px/s. ${vPicoGeral < V_ATIVA()*0.5
            ? "Muito abaixo: ou o movimento foi lento, ou o corpo ocupa pouco do quadro e o mesmo gesto rende menos pixels."
            : "Perto do limiar — faltou pouco."}${avisoCego}`]
    : !aceitos
        ? ["morre", `Porta 4 — o percurso mínimo. ${episodios.length} episódio(s) abriram, todos abaixo de ${COMP_MIN}px. O maior teve ${num(Math.max(...episodios.map(e=>e.comp)))}px.`]
        : ["passa", `${aceitos} episódio(s) capturado(s), de ${episodios.length} aberto(s). Na etapa 2 cada um vira até ${MAX_ARCOS} arcos.${avisoCego}`];

  const resumo = `pose ${saude.comPose}/${saude.quadros} · util ${saude.comLeitura} · ` +
    /* sem isto não dá para ler a captura de fora: os limiares são derivados do
       corpo, então dois resumos com os mesmos px/s podem estar em regimes
       completamente diferentes. */
    `ombros ${num(ombros)} (abre ${num(V_ATIVA())} pausa ${num(V_PAUSA())} vira ${num(VIRADA_MIN())}px/${VIRADA_MS}ms exc ${num(VIRADA_EXC())}px traco ${num(tracoAgora())}ms) · ` +
    MONITORADOS().map((f,i) => { const pp = saude.porPonto[i]||{};
      return `${f.nome}: pico ${num(pp.vPico)}/${num(pp.vBruto)} ` +
             `p10 ${num(pct(pp.vs,0.10))} p25 ${num(pct(pp.vs,0.25))} p50 ${num(pct(pp.vs,0.5))} ` +
             `p90 ${num(pct(pp.vs,0.9))} p99 ${num(pct(pp.vs,0.99))} ` +
             `saltos ${pp.salto||0} piscadas ${pp.piscadas||0}/${pp.perdas||0}perdeu ` +
             `vis ${(pp.visMax||0).toFixed(2)} visto ${pp.visto||0}`;
    }).join(" · ") +
    ` · episodios ${episodios.length} (${aceitos} aceitos)` +
    (episodios.length ? ": " + episodios.map(e =>
        `${e.nome} ${Math.round(e.comp)}px ${e.motivo}` +
        (e.fit ? ` [r${Math.round(e.fit.r)} sp${Math.round(e.fit.span*180/Math.PI)}` +
                 ` volta${e.fit.volta?e.fit.volta.toFixed(1):"?"}` +
                 ` dev ${(e.fit.rel*100).toFixed(1)}/${e.fit.rel2!=null?(e.fit.rel2*100).toFixed(1):"?"}` +
                 `/${e.fit.rel3!=null?(e.fit.rel3*100).toFixed(1):"?"}%]` : "") +
        (e.aceito?"":" REC")).join(", ") : "") +
    ` · arcos ${composicao.length}` +
    /* o que cada arco ANDOU (não cresceu) depois de nascer, em espessuras:
       durante o gesto / depois de o traço fechar. O segundo tem de ser ~0. */
    (composicao.length ? (() => {
      const esp = espessuraDe(composicao);
      return " · andou " + composicao.map(a =>
        `${((a.andouVivo||0)/esp).toFixed(1)}/${((a.andouFecho||0)/esp).toFixed(1)}/${((a.andouDepois||0)/esp).toFixed(1)}`
      ).join(" ") + " esp (vivo/fecho/depois)";
    })() : "") +
    (composicao.length ? (() => {
      const esp = espessuraDe(composicao);
      const fs = composicao.map(a => ({ a, f: fugaDoArco(a) })).filter(x => x.f);
      if (!fs.length) return "";
      fs.sort((x,y) => y.f.pior - x.f.pior);
      const perdidos = fs.filter(x => x.f.pior > esp*5).length;
      return ` · fuga ` + fs.map(x =>
        (x.f.pior/esp).toFixed(1) +
        (x.a.spanPreso ? "!" + x.a.spanPreso[0] : "") +
        (x.a.rGesto && (x.a.r/x.a.rGesto < 0.5 || x.a.r/x.a.rGesto > 2) ? "!r" + (x.a.r/x.a.rGesto).toFixed(1) : "")
      ).join(" ") + ` esp (${perdidos} perdido(s) >5)`;
    })() : "") +
    (coesao ? ` · coesao ${coesao.passos.length} conexao(oes) forcada(s), ${coesao.grupos} grupo(s)` +
              (coesao.passos.length ? " [" + coesao.passos.map(x => `${Math.round(x.folga)}→${Math.round(x.anda)}px`).join(" ") + "]" : "")
            : (COESAO_LIGADA ? "" : " · COESAO OFF")) +
    (CORTA_SALTO ? "" : " · SALTO OFF");

  d.innerHTML = `
    ${blocoDoCelular()}
    <section><h4>Veredito</h4><p class="${veredito[0]}">${veredito[1]}</p>
      <p style="margin-top:8px">resumo para copiar: <code id="diag-resumo">${resumo}</code></p></section>
    <section><h4>Máquina de exclusividade — ao vivo</h4>${maquina}</section>
    <section><h4>Captura</h4>${captura}</section>
    <section><h4>Episódios — um de cada vez, na ordem em que aconteceram</h4>
      <table>
        <tr><th>#</th><th>ponto</th><th>início</th><th>duração</th><th>amostras</th>
            <th>percurso</th><th>amplitude</th><th>raio</th><th>span</th><th>arco</th>
            <th>voltas</th><th>dev 1 arco</th><th>2 arcos</th><th>3 arcos</th>
            <th>fim</th><th>veredito</th></tr>
        ${linhasEp}
      </table>
      <p>“percurso” é quanto a mão andou; “amplitude” é a maior distância entre dois pontos do
         episódio. Percurso alto com amplitude baixa é agitação, não gesto — a diferença entre os
         dois é exatamente o que a redução a arco vai jogar fora na etapa 2.
         “desvio” é quanto o caminho da mão se afasta, em média, do círculo que melhor o
         descreve — é literalmente o tremor que não vai aparecer no desenho. “desvio/raio”
         é o que decide: abaixo de 10% o gesto cabe num arco e a §3 se sustenta; da ordem
         do raio, o gesto não é circular e nenhum arco o representa. Na Sens os arcos
         desviam 0,7 a 2,8 un num raio de 400 — 0,2 a 0,7%.
         “voltas” é o percurso dividido pelo comprimento do arco: perto de 1 é uma
         passada só, 4 ou 10 é vaivém — o episódio engoliu várias passadas da mão e
         nenhum círculo passa por cima disso. “dev 1/2/3 arcos” testa a prescrição da
         §5.2 contra esta captura: se partir em 3 não derruba o desvio abaixo de 10%,
         o problema não é a geometria, é o episódio ser longo demais.
         Traços vivos simultâneos: <b>máx. ${saude.maxSimultaneos}</b> —
         ${saude.quadrosAtivos} quadro(s) com traço vivo,
         ${saude.quadrosSilenciando} deles com movimento ignorado em outro ponto.</p>
    </section>
    <section><h4>Coesão — os vazios que foram fechados</h4>
      ${!COESAO_LIGADA ? `<p>desligada por ora (decisão da cliente) — os arcos ficam onde o gesto os pôs.
            Em movimento, vê-los deslizar uns na direção dos outros depois de cada gesto ficou estranho.
            ?coesao=1 traz de volta.</p>`
        : !coesao ? `<p>ainda não rodou.</p>`
        : `<table>
        <tr><th>medida</th><th>valor</th><th>o que significa</th></tr>
        <tr><td>aperto geral</td><td>${(COESAO_PUXA*100).toFixed(0)}% do vazio até o centroide</td>
            <td>maior deslocamento: ${num(coesao.puxa)}px</td></tr>
        <tr><td>conexões forçadas</td>
            <td class="${coesao.grupos<=1?'passa':'morre'}">${coesao.passos.length}</td>
            <td>${coesao.passos.length
                 ? coesao.passos.map(x => `arco ${x.i+1}↔${x.k+1}: folga ${num(x.folga)}px, andou ${num(x.anda)}px`).join("; ")
                 : "nenhuma — os arcos já se encostavam"}</td></tr>
        <tr><td>grupos soltos ao fim</td>
            <td class="${coesao.grupos<=1?'passa':'morre'}">${coesao.grupos}</td>
            <td>1 = a composição é uma peça só, que é o alvo</td></tr>
        <tr><td>mordida</td><td>${COESAO_MORDIDA} espessuras = ${num(espessuraDe(composicao)*COESAO_MORDIDA,1)}px</td>
            <td>penetração ao encostar: tangência não gera cruzamento dentro do span
                dos dois arcos, e sem cruzamento a regra das juntas não tem onde rodar</td></tr>
        </table>
        <p>A passada translada arcos INTEIROS, rígidos, e só depois de restaurar o centro
           original — idempotente pelo mesmo motivo da §5.3. Raio, extensão, sentido e
           orientação continuam saindo do gesto: o que muda é a distância entre os arcos.
           É a única regra do sistema que a spec não pede — a §5.2 diz "nunca rearranjado
           em torno de um centro comum", e essa frase foi escrita contra os templates da §6,
           em que o gesto entrava só como semente. Aqui a proveniência está intacta.</p>`}
    </section>
    <section><h4>Composição — os arcos do resultado</h4>
      ${composicao.length ? `<table>
        <tr><th></th><th>#</th><th>episódio</th><th>FUGA<br>mediana / pior</th>
            <th>raio<br>gesto → desenhado</th><th>span<br>gesto → desenhado</th>
            <th>desvio do ajuste</th><th>amostras</th></tr>
        ${composicao.map((a,i) => { const f = fugaDoArco(a), esp = espessuraDe(composicao);
          const rel = f ? f.pior/esp : null;
          return `<tr>
          <td><span style="display:inline-block;width:10px;height:10px;background:${a.vivo?'#FFF':corDoEpisodio(a.episodio)}"></span></td>
          <td>${i+1}${a.vivo?" vivo":""}</td>
          <td>${a.episodio ? a.episodio.nome : "—"}</td>
          <td class="${rel==null?'':rel<2?'passa':rel<5?'':'morre'}">${f
              ? num(f.mediana)+" / "+num(f.pior)+"px = "+(f.pior/esp).toFixed(1)+" esp."
              : "—"}</td>
          <td class="${a.rGesto && (a.r/a.rGesto<0.5 || a.r/a.rGesto>2) ? 'morre':''}">${num(a.rGesto)} → ${num(a.r)}
              ${a.rGesto ? "("+(a.r/a.rGesto).toFixed(2)+"×)" : ""}</td>
          <td class="${a.spanPreso?'morre':''}">${num((a.spanBruto||0)*180/Math.PI)}° → ${num(a.span*180/Math.PI)}°
              ${a.spanPreso ? "<br>PRESO NO "+(a.spanPreso==="curto"?"MÍNIMO":"TETO") : ""}</td>
          <td class="${a.devGesto<0.10?'passa':'morre'}">${(a.devGesto*100).toFixed(1)}%</td>
          <td>${a.nPts}</td></tr>`; }).join("")}
        </table>
        <p><b>FUGA</b> é a distância de cada ponto do trecho de gesto — já levado para o
           palco, porque a abstração é intencional — até o arco desenhado. É a
           única medida aqui que compara o TRAÇO com o MOVIMENTO. Todas as outras comparam o
           gesto com o círculo ajustado, e um gesto pode caber perfeitamente num círculo e mesmo
           assim virar um traço longe dele: entre o ajuste e o desenho, a §5.5 troca o raio medido
           por raio de fonte (${num(R_ARCO_MIN)}–${num(R_ARCO_MAX)}px) e prende o span entre 25° e 210°.
           Abaixo de 2 espessuras o traço está em cima do movimento; acima de 5 ele está solto
           perto dele. As colunas de raio e span dizem QUAL das duas trocas o empurrou.</p>
        <p>${composicao.length} arco(s) de ${episodios.filter(e=>e.aceito).length} episódio(s),
           no máximo ${MAX_ARCOS} por episódio. Espessura ${num(espessuraDe(composicao),1)}px =
           raio médio ÷ 30 (§5.5), uma só para toda a composição porque a Sens é monolinear.
           Faixa de raio permitida: ${num(R_ARCO_MIN)}–${num(R_ARCO_MAX)}px
           (0,20–0,32 de viewMin). Span alvo da fonte: 161°.
           Enquadramento ${moldura.k.toFixed(2)}×.</p>
        <p>k arcos só são aceitos se derrubarem o pior trecho a ${GANHO_MIN}<sup>k−1</sup> do
           que UM arco dava (corte de bom o bastante: ${(DEV_OK*100).toFixed(0)}%) — 2 arcos
           precisam de ${(GANHO_MIN*100).toFixed(0)}%, 3 de ${(GANHO_MIN*GANHO_MIN*100).toFixed(0)}%.
           A exigência cresce com o número de arcos: é ela que impede o “carimbo de arcos”
           que a §6 registra como rejeitado. Todos os k são avaliados — comparar cada k só
           com o anterior fazia o laço sair num degrau raso e nunca olhar para baixo.</p>
        <p>A forma de cada arco não foi rearranjada: raio, extensão e sentido são os do
           trecho de gesto, e o ponto médio do trecho manda na posição. A passada de coesão
           acima translada o conjunto para fechar os vazios — é a única coisa que mexe em
           onde os arcos estão.</p>`
        : `<p class="morre">Nenhum arco: ${episodios.filter(e=>e.aceito).length} episódio(s) aceito(s).</p>`}
    </section>
    <section><h4>Juntas — a composição contra o alfabeto medido</h4>
      ${(() => {
        if (!composicao.length) return `<p class="morre">Nenhum arco.</p>`;
        const pontas = composicao.length*2;
        const naJunta = composicao.reduce((n,a) => n + (a.juntaIni?1:0) + (a.juntaFim?1:0), 0);
        const angs = [];
        for (const a of composicao) for (const c of a.cruz) angs.push(c.ang*180/Math.PI);
        angs.sort((x,y) => x-y);
        const q = f => angs.length ? angs[Math.min(angs.length-1, Math.floor(f*angs.length))] : null;
        const avancos = [];
        for (const a of composicao){
          if (a.juntaIni) avancos.push(a.juntaIni.avanco*180/Math.PI);
          if (a.juntaFim) avancos.push(a.juntaFim.avanco*180/Math.PI);
        }
        const mAv = avancos.length ? avancos.reduce((x,y)=>x+y,0)/avancos.length : null;
        const esp = espessuraDe(composicao);
        const pct2 = Math.round(naJunta/pontas*100);
        return `<table>
          <tr><th>atributo</th><th>na fonte Sens</th><th>nesta composição</th></tr>
          <tr><td>terminais que morrem numa junta</td><td>205 de 252 = 81%</td>
              <td class="${pct2>=40?'passa':''}">${naJunta} de ${pontas} = ${pct2}%</td></tr>
          <tr><td>avanço além do cruzamento</td><td>19° · ≈6 espessuras</td>
              <td>${mAv!=null ? num(mAv,1)+"° · "+num(mAv*Math.PI/180*composicao[0].r/esp,1)+" espessuras" : "—"}</td></tr>
          <tr><td>ângulo de cruzamento</td><td>mediana 28° · p25 9° · p75 37°</td>
              <td>${angs.length ? "mediana "+num(q(.5))+"° · p25 "+num(q(.25))+"° · p75 "+num(q(.75))+"°" : "nenhum cruzamento"}</td></tr>
          <tr><td>cruzamentos</td><td>rasos, quase tangentes</td>
              <td>${angs.length} cruzamento(s) em ${composicao.length} arcos</td></tr>
          <tr><td>span de arco que não cruza</td><td>mediana 161°</td>
              <td>${composicao.filter(a=>!a.cruz.length).length} arco(s) livre(s),
                  ${composicao.filter(a=>a.teto).length} aparado(s) pelo teto</td></tr>
        </table>
        <p>A passada roda sobre a composição INTEIRA, não dentro de cada símbolo — dois arcos de
           gestos diferentes se cruzam igual, e a junta não sabe de episódios. Ela restaura
           baseStart/baseExtent antes de cortar, então pode rodar quantas vezes for preciso sem
           os arcos encolherem. O ângulo de cruzamento é MEDIDO, não imposto: forçar o ângulo
           arrastaria o arco para longe do gesto.</p>
        <p>Terminal solto não é defeito: 47 dos 252 terminais do alfabeto terminam no espaço.</p>`;
      })()}
    </section>
    <section><h4>Fusão nas juntas — o filtro gooey</h4>
      ${(() => {
        const esp = espessuraDe(composicao);
        return `<table>
          <tr><th>atributo</th><th>na fonte Sens</th><th>aqui</th></tr>
          <tr><td>cantos côncavos pontudos</td><td>0 de 196 medidos</td>
              <td>${GOO_LIGADO ? "nenhum — filtro ligado" : "TODOS — filtro desligado (?goo=0)"}</td></tr>
          <tr><td>raio do filete côncavo</td><td>0,75 × a espessura</td>
              <td>efeito do blur, não parâmetro</td></tr>
          <tr><td>sigma do blur de entrada</td><td>—</td>
              <td>${GOO_BLUR_RATIO} × espessura = ${num(esp*GOO_BLUR_RATIO,2)}px</td></tr>
          <tr><td>degrau de alfa</td><td>—</td>
              <td>ganho ${GOO_ALPHA_GAIN}, viés ${GOO_ALPHA_BIAS} — corte em alfa ${(-GOO_ALPHA_BIAS/GOO_ALPHA_GAIN).toFixed(2)}</td></tr>
          <tr><td>espessura do traço</td><td>constante, monolinear</td>
              <td>${num(esp,1)}px — o filtro não pode mudá-la</td></tr>
          <tr><td>espessura depois do filtro</td><td>idêntica (critério da §5.4)</td>
              <td class="passa">0,993 da original — medido por soma de alfa subpixel</td></tr>
          <tr><td>alcance da ponta</td><td>semicírculo perfeito</td>
              <td class="morre">0,755 da original — o gooey come convexo e preenche côncavo</td></tr>
        </table>
        <p>GOO_BLUR_RATIO é o SIGMA DO BLUR DE ENTRADA, não o raio do filete que aparece.
           São coisas diferentes: o blur é a causa, o filete é o efeito. Usar 0,75 aqui — que
           é o raio medido do filete — derrete o desenho num blob e as pontas somem.</p>
        <p>Critério de aceitação: a espessura aparente tem de ser idêntica à de antes do
           filtro. A única diferença visível é o canto côncavo arredondado onde dois traços se
           cruzam. Compare com <code>?goo=0</code>.</p>
        <p>Dentro do canvas offscreen todo traço é desenhado com alfa 1 — alfa parcial é
           apagado inteiro pelo limiar. O fade da etapa 5 entra depois do filtro.</p>
        <p>Erosão da ponta é INERENTE ao gooey: blur mais limiar preenche canto côncavo e
           come extremidade convexa, e o terminal da Sens é convexo. Medido: blur 0,20 preserva
           a ponta inteira e quase não funde; 0,30 funde e tira um quarto do alcance da ponta.
           0,30 é o valor que a §5.4 dá como validado. <code>?goo=0</code> compara.</p>`;
      })()}
    </section>
    <section><h4>Como ler os percentis</h4>
      <p>Velocidade entre amostras consecutivas, antes do corte de salto.</p>
      <p><b>p10 e p25</b> dizem onde está o repouso. É de lá que ${"V_ATIVA"} deveria sair:
         o limiar precisa ficar ACIMA do p25 para separar parado de gesto. Se o p25 já
         está acima de ${num(V_ATIVA())} px/s (marcado em vermelho), a mão nunca fica abaixo do
         limiar enquanto gesticula — a regra “o primeiro que cruza vence” dispara de
         imediato e não discrimina nada, e o traço só fecha na pausa.</p>
      <p><b>p90 contra p99</b> diz quanto ainda é artefato. Separação de uma ordem de
         grandeza significa que dá para cortar o erro sem cortar o gesto; separação de
         2× significa que não dá, e o teto (hoje ${SALTO_LARGURAS} larguras de cena por
         segundo = ${V_SALTO} px/s) só pode cortar o indefensável.</p>
    </section>
    <section><h4>Etapa 4 de 5</h4>
      <p>Captura, arbitragem, redução a arcos, regra das juntas e fusão. O rastro cru aparece
         só aqui, sob o diagnóstico — no modo normal só o arco existe. Falta a experiência ao
         vivo (5): arcos persistentes, cálculo incremental, interpolação com inércia.</p>
    </section>`;
}

/* ===================== telas ===================== */
function vai(e){
  estado = e;
  $("c-repouso").hidden = e !== "repouso";
  $("c-calibra").hidden = e !== "calibra";
  $("c-conta").hidden   = e !== "conta";
  $("c-erro").hidden    = e !== "erro";
  $("ctrl").hidden      = e !== "resultado";
  $("ctrl-fonte").hidden = false;   // a escolha de leitura fica sempre alcançável
  $("relogio").hidden   = e !== "grava";
  $("barra").hidden     = e !== "grava";
  $("fase-hud").hidden  = !(diagLigado && (e === "grava" || e === "calibra"));
  pinta();
}
function erro(msg){ $("t-erro").textContent = msg; vai("erro"); }

/* ===================== câmera ===================== */
async function ligaCamera(){
  $("t-calibra").textContent = "Carregando…"; vai("calibra");
  zera();
  let fluxo;
  try{
    fluxo = await navigator.mediaDevices.getUserMedia({video:{width:640, height:480, facingMode:"user"}});
  }catch(e){
    return erro("A câmera não foi liberada. Autorize o acesso no navegador e tente de novo, ou desenhe com o dedo.");
  }
  video.srcObject = fluxo; await video.play();
  try{
    const mod = await import(`${jsd}/vision_bundle.mjs`);
    fonte.mod = mod;
    const fs = await mod.FilesetResolver.forVisionTasks(`${jsd}/wasm`);
    try { detector = await fonte.cria(fs, "GPU"); delegateUsado = "GPU"; }
    catch(e){ detector = await fonte.cria(fs, "CPU"); delegateUsado = "CPU (GPU falhou)"; }
  }catch(e){
    fluxo.getTracks().forEach(t => t.stop());
    saude.ultimoErro = String(e && e.message || e).slice(0, 200);
    return erro("A leitura de corpo não carregou aqui — a página precisa buscar o modelo na internet.");
  }
  $("t-calibra").textContent = fonte.dica;
  laco();
}
function laco(){
  requestAnimationFrame(laco);
  if (!detector || video.readyState < 2) return;
  const agora = performance.now();

  if (estado === "calibra" || estado === "grava"){
    try{
      const r = detector.detectForVideo(video, agora);
      leituraAtual = fonte.le(r);
      cruAtual = fonte.cru(r);
      escalaAtual = fonte.escala ? fonte.escala(r) : null;
    }catch(e){
      saude.erros++; saude.ultimoErro = String(e && e.message || e).slice(0, 140);
      leituraAtual = []; cruAtual = null; escalaAtual = null;
    }
  }

  if (estado === "calibra"){
    /* a calibragem roda a mesma leitura e os mesmos buffers da captura, sem a
       máquina de estados. É aqui que a pessoa confere o ALCANCE antes de gravar:
       se, acenando na calibragem, a velocidade do pulso não chega a V_ATIVA, ela
       também não vai chegar nos 5s da captura — e isso se descobre agora, não
       depois de um resultado vazio. */
    const uteis = observa(leituraAtual, agora, escalaAtual);
    const ok = uteis > 0;
    $("b-gravar").hidden = !ok;
    const pico = saude.porPonto.length ? Math.max(...saude.porPonto.map(p => p.vPico)) : 0;
    $("t-calibra").textContent =
        saude.erros > 20 ? "A leitura falhou neste aparelho."
      : !saude.comPose  ? fonte.dica
      : !ok             ? "O corpo aparece, mas os pontos que importam ainda não. " + fonte.dica
      : pico >= V_ATIVA() ? "Pronto. São só pontos."
      : "Pronto. Acene uma vez para conferir o alcance.";
    talvezDiag(agora);
    pinta(); return;
  }
  if (estado === "grava"){
    processaQuadro(leituraAtual, agora, escalaAtual);
    /* durante a captura quem toca a inércia é este laço, que já roda todo quadro.
       Um segundo rAF só para animar pintaria a mesma cena duas vezes. */
    const dtq = agora - (ultimoQuadro || agora - 16.7);
    if (ANIMA && composicao.some(a => a.des)) passoDeInercia(dtq);
    else if (ANIMA) passoDaBola(1 - Math.exp(-Math.max(1, Math.min(100, dtq))/INERCIA_TAU));
    ultimoQuadro = agora;
    pinta();
    talvezDiag(agora);
  }
}

/* o painel é HTML: reconstruí-lo a 60 Hz é desperdício e atrapalha a leitura */
let ultimoDiag = 0;
function talvezDiag(agora){
  if (!diagLigado || agora - ultimoDiag < 120) return;
  ultimoDiag = agora;
  pintaDiag();
}

/* ===================== gravação ===================== */
function zera(){
  limpaBuffers();
  ativo = null; fase = "procurando"; assentaAte = 0;
  episodios = []; composicao = []; coesao = null; retomada = -1; vivo = null; heranca = null;
  bola = null; bolaDes = null;
  if (animando){ cancelAnimationFrame(animando); animando = 0; }
  ultimoQuadro = 0;
  moldura = {k:1, dx:0, dy:0}; molduraDes = null;
  silenciados = MONITORADOS().map(() => 0);
  perdaDesde = MONITORADOS().map(() => 0);
  vAgora = MONITORADOS().map(() => 0);
  leituraAtual = []; cruAtual = null;
  zeraPontos();
  saude.escalaVista = 0; saude.escalaMin = null; saude.escalaMax = null;
  saude.quadros = saude.comPose = saude.comLeitura = saude.semLeitura = saude.erros = 0;
  saude.quadrosAtivos = saude.quadrosSilenciando = saude.maxSimultaneos = 0;
  saude.ultimoErro = ""; saude.t0 = saude.t1 = performance.now();
}
function contagem(){
  zera();
  let n = Math.round(CONTAGEM_MS/1000);
  $("n-conta").textContent = n; vai("conta");
  const t = setInterval(() => {
    if (--n === 0){ clearInterval(t); grava(); } else $("n-conta").textContent = n;
  }, 1000);
}
function grava(){
  zera(); vai("grava");
  const t0 = performance.now();
  saude.t0 = t0;
  (function tick(){
    const d = performance.now() - t0;
    $("relogio").textContent = (Math.max(0, CAPTURA_MS-d)/1000).toFixed(1) + "s";
    $("barra").style.width = (Math.min(1, d/CAPTURA_MS)*100) + "%";
    if (d < CAPTURA_MS) requestAnimationFrame(tick);
    else encerra(performance.now());
  })();
}
function encerra(agora){
  relogio = agora;
  if (ativo) fixa(agora, "fim da captura");   // e este último episódio já se incorpora
  cruAtual = null; leituraAtual = []; escalaAtual = null;

  /* A redução já rodou, uma vez por episódio, no instante em que cada um fechou.
     Aqui não se reconstrói nada: reconstruir seria trocar os arcos que já estão
     na tela por outros, que é exatamente o que a §6 proíbe. O que falta é só o
     enquadramento — que durante a captura fica em 1:1 de propósito, para o traço
     cair onde a mão passou, e só agora pode centralizar o que existe. */
  refazPassadas();
  /* O ZOOM DE FECHAMENTO TAMBÉM SAIU, pelo mesmo motivo: a cena inteira
     mudando de escala logo depois do último gesto tira o traço de onde a pessoa
     acabou de fazê-lo. Sem ele, o desenho fica exatamente onde a mão passou, do
     primeiro quadro ao último — que é o mesmo princípio que já valia durante a
     captura. ?enquadra=1 traz de volta. */
  if (ENQUADRA_FIM){
    /* congela o enquadramento em vigor (1:1, o da captura) ANTES de trocar o
       alvo: é essa diferença que a inércia percorre, e é ela que faz o símbolo
       se centralizar e crescer em vez de aparecer já enquadrado. */
    semeiaDesenho();
    moldura = enquadra(composicao, espessuraDe(composicao));
  }
  vai("resultado");
  animaComposicao();          // o símbolo se assenta e se enquadra
  pintaDiag();
}

/* ===================== modo dedo =====================
   Mesma máquina de estados, alimentada pelo ponteiro: serve para exercitar a
   arbitragem e os limiares sem depender da câmera. */
function ligaDedo(){
  modoDedo = true;
  fonte = { ...FONTES.pose, rotulo:"dedo", modelo:"—",
            pontos:[{nome:"dedo", lm:-1}] };
  zera(); vai("grava");
  $("relogio").hidden = true; $("barra").hidden = true;
  $("ctrl").hidden = false;
  let desenhando = false;
  const coord = ev => {
    const r = tela.getBoundingClientRect();
    return { x:1 - (ev.clientX-r.left)/r.width, y:(ev.clientY-r.top)/r.height };
  };
  tela.style.touchAction = "none";
  tela.addEventListener("pointerdown", e => {
    desenhando = true; e.preventDefault();
  });
  tela.addEventListener("pointermove", e => {
    if (!desenhando) return;
    const c = coord(e);
    processaQuadro([{i:0, x:c.x, y:c.y}], performance.now(), OMBROS_REF);
    pinta(); talvezDiag(performance.now()); e.preventDefault();
  });
  window.addEventListener("pointerup", () => {
    if (!desenhando) return;
    desenhando = false;
    const agora = performance.now();
    if (ativo) fixa(agora, "soltou");   // fixa() já incorpora o episódio
    saude.t1 = agora;
    moldura = {k:1, dx:0, dy:0};        // no dedo o traço fica onde foi feito
    animaComposicao(); pintaDiag();
  });
}

/* ===================== controles ===================== */
/* Trocar de leitura depois que a câmera ligou exige recriar o detector e o
   modelo. A versão anterior simplesmente não fazia nada nesse caso — e sem dizer
   nada, o que rendeu três sessões seguidas em Pose quando o que se queria era
   comparar com Hands. A escolha vai para a URL e a página recarrega: é uma
   troca de modelo, não de variável. */
function escolheFonte(f){
  if (FONTES[f] === fonte && !detector){
    marcaFonte(f); return;
  }
  if (!detector){ fonte = FONTES[f]; marcaFonte(f); zera(); return; }
  const u = new URL(location.href);
  u.searchParams.set("fonte", f);
  location.replace(u.toString());
}
function marcaFonte(f){
  $("f-pose").setAttribute("aria-pressed", String(f === "pose"));
  $("f-mao").setAttribute("aria-pressed", String(f === "mao"));
}
function alternaDiag(){
  diagLigado = !diagLigado;
  $("diag").hidden = !diagLigado;
  $("b-diag").setAttribute("aria-pressed", String(diagLigado));
  $("fase-hud").hidden = !(diagLigado && (estado === "grava" || estado === "calibra"));
  if (diagLigado) pintaDiag();
  pinta();
}
$("b-camera").onclick = ligaCamera;
$("b-dedo").onclick = ligaDedo;
$("b-dedo2").onclick = ligaDedo;
$("b-gravar").onclick = contagem;
$("b-diag").onclick = alternaDiag;
$("f-pose").onclick = () => escolheFonte("pose");
$("f-mao").onclick  = () => escolheFonte("mao");
$("b-refazer").onclick = () => {
  zera();
  if (modoDedo){ vai("grava"); $("relogio").hidden = true; $("barra").hidden = true; $("ctrl").hidden = false; }
  else if (detector) vai("calibra");
  else vai("repouso");
  pinta(); pintaDiag();
};
addEventListener("keydown", e => {
  if (e.key === "d" || e.key === "D"){
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || "")) return;
    alternaDiag();
  }
});
/* Durante as etapas de reconstrução o diagnóstico nasce LIGADO: com a cena preta
   em modo normal, desligá-lo é a diferença entre "não gravou nada" e saber qual
   porta fechou. Desliga em ?diag=0 — e, quando a etapa 5 estiver de pé, o padrão
   volta a ser desligado. */
if (!location.search.includes("diag=0")) alternaDiag();

const fonteURL = new URLSearchParams(location.search).get("fonte");
if (fonteURL && FONTES[fonteURL]) fonte = FONTES[fonteURL];
marcaFonte(fonte.id);

zera();
pinta();

/* exposto para inspeção no console e para alimentar a máquina com uma leitura
   sintética, sem câmera — é assim que a arbitragem se testa de verdade */
window.PLC = {
  get episodios(){return episodios}, get ativo(){return ativo}, get fase(){return fase},
  get buf(){return buf}, get silenciados(){return silenciados}, get saude(){return saude},
  get fonte(){return fonte}, get composicao(){return composicao}, get moldura(){return moldura},
  get coesao(){return coesao}, get vivo(){return vivo}, get bola(){return bolaDes||bola},
  paraOPalco, aproxima, viradaEm, folgaEntre, cruzamentosDe,
  get molduraDes(){return molduraDes}, animaComposicao, semeiaDesenho, erroDoDesenho, desenhoDe,
  passoDeInercia, fugaDoArco, corDoEpisodio, paraOndeEsta,
  reduzAArcos, arcoDeTrecho, circulo, spanDe, reamostra, pontosDoArco, espessuraDe, enquadra,
  applyCompositionJoints, cruzaCirculos, anguloCruzamento, offsetNoArco, deslocamento,
  pintaComposicao, get off(){return off}, get off2(){return off2},
  G: { GOO_BLUR_RATIO, GOO_ALPHA_GAIN, GOO_ALPHA_BIAS, GOO_FILETE, GOO_LIGADO },
  processaQuadro, percurso, amplitude, velocidade, pinta, pintaDiag,
  teste: {
    inicia(t){ zera(); if (t != null) saude.t0 = saude.t1 = t; estado = "grava"; vai("grava"); },
    /* o mesmo que laco() faz na fase "grava", inclusive a inércia: sem isso o
       teste mediria uma composição que salta, e o produto não salta. */
    quadro(leituras, t, escala){
      const dt = ultimoQuadro ? t - ultimoQuadro : 16.7;
      ultimoQuadro = t;
      processaQuadro(leituras, t, escala);
      if (ANIMA && composicao.some(a => a.des)) passoDeInercia(dt);
      else if (ANIMA) passoDaBola(1 - Math.exp(-Math.max(1, Math.min(100, dt))/INERCIA_TAU));
      pinta();
    },
    encerra(t){ encerra(t); },
    /* roda a inércia sem o relógio do navegador, para a animação ser mensurável */
    anima(maxQuadros = 600){
      let n = 0;
      while (n < maxQuadros && composicao.some(a => a.des)){ passoDeInercia(16.7); n++; }
      pinta();
      return n;
    }
  },
  P: { get V_ATIVA(){return V_ATIVA()}, get V_PAUSA(){return V_PAUSA()},
       ESCALA_ATIVA, ESCALA_PAUSA, get ombros(){return ombros}, PAUSA_MS, ASSENTA_MS, JANELA_MS, MEM_MS, COMP_MIN, RETRO,
       CONTAGEM_MS, CAPTURA_MS, W, H, VIEW_MIN,
       R_BASE, R_FAIXA, WIDTH_RATIO, MEDIAN_EXTENT, JOINT_OVERSHOOT, CROSSING_ANGLE, MAX_ARCOS,
       VIRADA_MS, VIRADA_RET, VIRADA_PISO, VIRADA_VOLTA, VIRADA_IDAS,
       PALCO_RAIO, TRACO_MS, get TRACO_AGORA(){return tracoAgora()}, BOLA_RAIO, BOLA_FOLGA, BOLA_MARGEM, DESENHO_RAIO, NASCE_RAIO, PERDA_MS,
       get VIRADA_MIN(){return VIRADA_MIN()}, get VIRADA_EXC(){return VIRADA_EXC()},
       COESAO_LIGADA, COESAO_PUXA, COESAO_MORDIDA, COESAO_CONTATO, DEV_OK, GANHO_MIN,
       VIVO_AMOSTRAS,
       INERCIA_TAU, INERCIA_PARA, INERCIA_TETO, ANIMA, ENQUADRA_FIM, CONGELA, RAIO_DO_GESTO, CORRENTE }
};
